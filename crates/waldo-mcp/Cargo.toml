[package]
name = "waldo-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Waldo's MCP server, exposing query, observe, act and stop to agents."

[dependencies]
base64.workspace = true
image.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
waldo-protocol = { path = "../waldo-protocol" }
waldo-settings = { path = "../waldo-settings" }
waldo-socket = { path = "../waldo-socket" }

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
waldo-action = { path = "../waldo-action" }
waldo-controller = { path = "../waldo-controller" }
waldo-niri = { path = "../waldo-niri" }
waldo-screencopy = { path = "../waldo-screencopy" }
waldo-service = { path = "../waldo-service" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "waldo-mcp"
path = "src/main.rs"
