[package]
name = "waldo-service"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
base64.workspace = true
clap.workspace = true
nix.workspace = true
serde_json.workspace = true
tokio.workspace = true
waldo-action = { path = "../waldo-action" }
waldo-accessibility = { path = "../waldo-accessibility" }
waldo-clipboard = { path = "../waldo-clipboard" }
waldo-controller = { path = "../waldo-controller" }
waldo-niri = { path = "../waldo-niri" }
waldo-protocol = { path = "../waldo-protocol" }
waldo-screencopy = { path = "../waldo-screencopy" }
waldo-socket = { path = "../waldo-socket" }
waldo-virtual-pointer = { path = "../waldo-virtual-pointer" }
waldo-virtual-keyboard = { path = "../waldo-virtual-keyboard" }

[lib]
path = "src/lib.rs"

[dev-dependencies]
niri-ipc.workspace = true

[[bin]]
name = "waldod"
path = "src/main.rs"
