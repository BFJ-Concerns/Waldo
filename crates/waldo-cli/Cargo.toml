[package]
name = "waldo-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Waldo's command-line client for the controller protocol."

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
waldo-protocol = { path = "../waldo-protocol" }
waldo-socket = { path = "../waldo-socket" }

[dev-dependencies]
waldo-action = { path = "../waldo-action" }
waldo-niri = { path = "../waldo-niri" }
waldo-screencopy = { path = "../waldo-screencopy" }
waldo-service = { path = "../waldo-service" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "waldo"
path = "src/main.rs"
