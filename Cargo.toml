[workspace]
members = [
    "crates/waldo-cli",
    "crates/waldo-controller",
    "crates/waldo-protocol",
    "crates/waldo-service",
    "crates/waldo-socket",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "=4.6.1", features = ["derive"] }
nix = { version = "=0.31.3", features = ["socket", "user"] }
schemars = { version = "=1.2.1" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150" }
tokio = { version = "=1.52.3", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
