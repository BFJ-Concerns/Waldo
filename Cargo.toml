[workspace]
members = [
    "crates/waldo-controller",
    "crates/waldo-protocol",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
schemars = { version = "=1.2.1" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150" }
