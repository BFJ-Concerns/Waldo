[workspace]
members = [
    "crates/waldo-action",
    "crates/waldo-accessibility",
    "crates/waldo-cli",
    "crates/waldo-clipboard",
    "crates/waldo-controller",
    "crates/waldo-mcp",
    "crates/waldo-niri",
    "crates/waldo-protocol",
    "crates/waldo-screencopy",
    "crates/waldo-service",
    "crates/waldo-socket",
    "crates/waldo-virtual-pointer",
    "crates/waldo-virtual-keyboard",
    "crates/waldo-verification",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
atspi-common = { version = "=0.14.0" }
base64 = { version = "=0.22.1" }
clap = { version = "=4.6.1", features = ["derive"] }
image = { version = "=0.25.9", default-features = false, features = ["png"] }
memmap2 = { version = "=0.9.11" }
nix = { version = "=0.31.3", features = ["fs", "poll", "socket", "user"] }
niri-ipc = { version = "=26.4.0" }
schemars = { version = "=1.2.1" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150" }
tokio = { version = "=1.52.3", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
wayland-client = { version = "=0.31.14" }
wayland-backend = { version = "=0.3.15" }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
wayland-scanner = { version = "=0.31.10" }
xkbcommon = { version = "=0.9.0", default-features = false }
wl-clipboard-rs = { version = "=0.9.3" }
zbus = { version = "=5.13.2" }
